<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Live Poll | شاشة العرض</title><link rel="stylesheet" href="style.css"><script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-database-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script><script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script><script src="firebase-config.js"></script><script src="common.js"></script><style>body{background:#0D2342;color:white}main{max-width:1300px;padding:2vw 4vw}header{display:flex;justify-content:space-between;background:#fff;border-radius:16px;padding:10px 28px}header img{height:48px;max-width:160px;object-fit:contain}.stage{text-align:center;padding:4vh 0}h1{font-size:clamp(28px,4.5vw,68px)}h2{font-size:clamp(23px,3vw,48px)}p{font-size:clamp(17px,2vw,30px)}.join{display:flex;gap:30px;justify-content:center;align-items:center;flex-wrap:wrap}.qr{background:white;padding:15px;border-radius:15px}.code{font-size:50px;font-weight:bold}.result{margin:22px auto;max-width:1000px;text-align:start}.rhead{display:flex;justify-content:space-between;gap:20px;font-size:clamp(20px,2.1vw,34px)}.rbar{height:25px;background:#ffffff26;border-radius:20px;overflow:hidden}.rbar i{display:block;height:100%;background:#0E7A45;transition:width 1.1s ease}.muted{color:#b6c9e2}.pulse{animation:pulse 1.8s infinite}@keyframes pulse{50%{opacity:.45}}@media(prefers-reduced-motion:reduce){.pulse{animation:none}.rbar i{transition:none}}</style></head><body><main><header><img src="mts.png" alt="MTS"><img src="training.png" alt="Training Team"></header><div id="app" class="stage"></div></main><script>
const $=id=>document.getElementById(id),app=$("app"),R=roomId();let stage="",current=null;
function show(t){app.innerHTML="<h2>"+esc(t)+"</h2>"}
if(!R)show("افتح شاشة العرض من لوحة المدرب بعد إنشاء الغرفة");
else auth.onAuthStateChanged(async u=>{if(!u){try{await auth.signInAnonymously()}catch(e){show("تعذّر تسجيل الدخول إلى Firebase")};return}
db.ref("rooms/"+R).on("value",s=>{const d=s.val();if(!d||!d.meta||d.meta.activity!=="poll"){show("الغرفة غير موجودة أو انتهت");return}render(d)},()=>show("تعذّر الوصول إلى الغرفة"))});
function render(d){const ph=d.ctl.phase,players=Object.keys(d.players||{}).length,q=d.qs[0],key=ph+":"+JSON.stringify(d.cnt||{});if(ph==="lobby"){if(stage!=="lobby"){stage="lobby";const join=new URL("poll.html?room="+R,location.href).href;app.innerHTML='<h1>'+esc(d.meta.title)+'</h1><p>امسح QR للمشاركة</p><div class="join"><div class="qr" id="qr"></div><div><p>رمز الغرفة</p><div class="code" dir="ltr">'+esc(R)+'</div><p class="muted" id="people"></p></div></div>';if(window.QRCode)new QRCode($("qr"),{text:join,width:260,height:260})}if($("people"))$("people").textContent="المشاركون: "+players;return}
if(ph==="q"){if(stage!=="q"){stage="q";app.innerHTML='<h1>'+esc(d.meta.title)+'</h1><h2>'+esc(q.q)+'</h2><p class="pulse">التصويت مفتوح الآن...</p><p class="muted">المشاركون: <span id="people">'+players+'</span></p><p class="muted">هتظهر النتيجة لما المدرب يقفل التصويت</p>'}if($("people"))$("people").textContent=players;return}
if(ph==="rev"){if(stage===key)return;stage=key;const c=(d.cnt||{})[0]||[],tot=Math.max(1,c.reduce((a,b)=>a+(b||0),0));app.innerHTML='<h1>نتيجة التصويت</h1><h2>'+esc(q.q)+'</h2>'+q.o.map((o,i)=>'<div class="result"><div class="rhead"><span>'+esc(o)+'</span><b>'+(c[i]||0)+' — '+Math.round((c[i]||0)/tot*100)+'%</b></div><div class="rbar"><i style="width:'+Math.round((c[i]||0)/tot*100)+'%"></i></div></div>').join("")}}
</script></body></html>
