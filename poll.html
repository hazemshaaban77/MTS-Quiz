<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Live Poll | مشاركة</title><link rel="stylesheet" href="style.css"><script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-database-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script><script src="firebase-config.js"></script><script src="common.js"></script><style>main{max-width:610px}.choice{display:block;width:100%;border:2px solid var(--line);background:var(--card);color:var(--ink);padding:20px;text-align:start;margin:12px 0;border-radius:14px;font:inherit;cursor:pointer}.choice:disabled{opacity:.7;cursor:default}.choice.selected{border-color:var(--g)}.stat{height:10px;background:#8fa4b633;border-radius:9px;overflow:hidden}.stat i{display:block;height:100%;background:#0E7A45;transition:width .3s}.sub{color:var(--mute)}.results{margin:15px 0}</style></head><body><main><header><img src="mts.png" alt="MTS"><img src="training.png" alt="Training Team"></header><div id="app"></div></main><script>
const $=id=>document.getElementById(id),app=$("app"),R=roomId();let U="",D=null,pick=null,lastPhase="",sending=false;
function message(s){app.innerHTML='<div class="card"><p>'+esc(s)+'</p></div>'}
if(!R)message("افتح رابط التصويت المرسل من المدرب أو امسح QR");
else auth.onAuthStateChanged(async u=>{if(!u){try{await auth.signInAnonymously()}catch(e){message("تعذّر الاتصال. تأكد من تفعيل Anonymous Authentication")};return}U=u.uid;db.ref("rooms/"+R).on("value",s=>{D=s.val();if(!D||!D.meta||D.meta.activity!=="poll"){message("غرفة التصويت غير متاحة");return}render()},()=>message("تعذّر قراءة الغرفة؛ راجع الاتصال"))});
function render(){const phase=D.ctl.phase,me=(D.players||{})[U],opts=D.qs[0].o;if(!me||!me.name){if(D.ctl.lock){message("انتهى الانضمام للتصويت");return}if(lastPhase==="join")return;lastPhase="join";app.innerHTML='<h1>'+esc(D.meta.title)+'</h1><p>اكتب اسمك ورقمك الوظيفي للانضمام</p><div class="card"><input id="name" maxlength="30" placeholder="الاسم"><input id="eid" maxlength="20" dir="ltr" placeholder="الرقم الوظيفي"><button class="btn" id="join">انضم</button><p class="err" id="err"></p></div>';$("join").onclick=join;return}
if(phase==="lobby"){lastPhase="lobby";message("تم الانضمام بنجاح يا "+me.name+". انتظر المدرب لبدء التصويت.");return}
if(phase==="q"){if(lastPhase==="q")return;lastPhase="q";try{const v=localStorage.getItem("pollVote:"+R+":"+U);if(v!==null&&/^[0-3]$/.test(v))pick=+v}catch(e){}
app.innerHTML='<h1>'+esc(D.meta.title)+'</h1><h2>'+esc(D.qs[0].q)+'</h2><div id="choices">'+opts.map((v,i)=>'<button class="choice'+(pick===i?' selected':'')+'" data-opt="'+i+'" '+(pick!==null?'disabled':'')+'>'+esc(v)+'</button>').join("")+'</div><p id="status" class="sub">'+(pick!==null?"تم تسجيل صوتك":"اختار إجابة واحدة، من غير نقاط أو إجابة صحيحة")+'</p>';
$("choices").onclick=e=>{const b=e.target.closest("button[data-opt]");if(b)vote(+b.dataset.opt)};return}
if(phase==="rev"){lastPhase="rev";const c=(D.cnt||{})[0]||[],tot=Math.max(1,c.reduce((a,b)=>a+(b||0),0));app.innerHTML='<h1>نتيجة التصويت</h1><h2>'+esc(D.qs[0].q)+'</h2>'+opts.map((v,i)=>'<div class="results"><div>'+esc(v)+' — '+(c[i]||0)+' ('+Math.round((c[i]||0)/tot*100)+'%)</div><div class="stat"><i style="width:'+((c[i]||0)/tot*100)+'%"></i></div></div>').join("")+'<p class="sub">شكرًا على مشاركتك</p>';return}}
async function join(){const n=$("name").value.trim(),id=$("eid").value.trim().toUpperCase().replace(/[^A-Z0-9_-]/g,"");if(!n||!id){$("err").textContent="اكتب الاسم والرقم الوظيفي";return}const b=$("join");b.disabled=true;try{await db.ref("eids/"+R+"/"+id).set(U);await db.ref("rooms/"+R+"/players/"+U+"/name").set(n)}catch(e){$("err").textContent="تعذّر الانضمام، راجع الرقم الوظيفي أو تأكد إن التصويت لسه مفتوح";b.disabled=false}}
async function vote(k){if(pick!==null||sending||D.ctl.phase!=="q")return;sending=true;const btns=[...document.querySelectorAll(".choice")];btns.forEach(b=>b.disabled=true);$("status").textContent="جاري تسجيل صوتك...";
try{await db.ref("ans/"+R+"/0/"+U).set({k,ts:firebase.database.ServerValue.TIMESTAMP});pick=k;try{localStorage.setItem("pollVote:"+R+":"+U,String(k))}catch(e){}btns[k]?.classList.add("selected");$("status").textContent="تم تسجيل صوتك بنجاح"}catch(e){$("status").textContent="تعذّر إرسال التصويت. حاول مجددًا.";btns.forEach(b=>b.disabled=false)}finally{sending=false}}
</script></body></html>
