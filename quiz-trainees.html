<style>
:root {
  --nafeza-primary: #1B498A;
  --nafeza-dark: #0D2342;
  --nafeza-green: #0E7A45;
  --bg: #F4F7FB;

}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:"Readex Pro",sans-serif;line-height:1.6;margin:0;min-height:100vh}
main{max-width:620px;margin:0 auto;padding:16px;animation:fadeIn 0.4s ease-out}

/* هيدر مستوحى من بوابة نافذة الرسمية */
.header-logos {
  display: flex;
  justify-content: space-between;
  align-items: center;
  background: var(--card);
  padding: 14px 20px;
  border-radius: 16px;
  box-shadow: 0 4px 20px rgba(27,73,138,0.06);
  margin-bottom: 16px;
  border-top: 4px solid var(--nafeza-primary);
  border-left: 1px solid var(--line);
  border-right: 1px solid var(--line);
  border-bottom: 1px solid var(--line);
  min-height: 65px;
}
.brand-right, .brand-left { display: flex; align-items: center; gap: 12px; }
.logo-img { height: 40px; max-width: 140px; object-fit: contain; }

@keyframes fadeIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
@keyframes pulse { 0% { transform: scale(1); } 50% { transform: scale(1.02); } 100% { transform: scale(1); } }

.card {
  background: var(--card);
  border-radius: 16px;
  padding: 24px;
  margin-bottom: 16px;
  box-shadow: 0 4px 16px rgba(0,0,0,0.03);
  border: 1px solid var(--line);
  transition: all 0.3s ease;
}
.card:hover { border-color: rgba(27,73,138,0.3); box-shadow: 0 6px 20px rgba(27,73,138,0.06); }

h1 { font-size: 23px; color: var(--nafeza-primary); margin: 0 0 10px; text-align: center; font-weight: 700; }
h2 { font-size: 19px; color: var(--nafeza-dark); margin: 0 0 14px; font-weight: 500; }
p { color: var(--mute); margin: 0 0 12px; }

input:not([type=radio]), textarea {
  width: 100%; font: inherit; padding: 13px 16px; border-radius: 12px;
  border: 2px solid var(--line); background: #FAFAFC; color: var(--ink);
  margin-bottom: 12px; transition: all 0.2s ease;
}
input:focus, textarea:focus { border-color: var(--nafeza-primary); background: #FFFFFF; outline: none; box-shadow: 0 0 0 3px rgba(27,73,138,0.1); }

.btn {
  width: 100%; font: inherit; font-weight: 700; padding: 14px; border: 0;
  border-radius: 12px; background: var(--nafeza-primary); color: var(--on);
  cursor: pointer; transition: all 0.2s ease; box-shadow: 0 4px 12px rgba(27,73,138,0.15);
}
.btn:hover:not(:disabled) { background: #143769; transform: translateY(-1px); }
.btn:active { transform: translateY(0); }
.btn:disabled { background: #CBD5E1; cursor: not-allowed; box-shadow: none; }

.btn.alt { background: transparent; color: var(--nafeza-primary); border: 2px solid var(--nafeza-primary); box-shadow: none; }
.btn.alt:hover { background: rgba(27,73,138,0.05); }

.top { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; color: var(--mute); font-size: 14px; }
.time { font-size: 28px; font-weight: 700; color: var(--nafeza-primary); }
.time.low { color: var(--bad); animation: pulse 0.5s infinite; }

.tbar { height: 10px; border-radius: 6px; background: var(--line); overflow: hidden; margin-bottom: 16px; }
.tbar i { display: block; height: 100%; width: 100%; background: var(--nafeza-green); transition: width 0.1s linear; }

.opt {
  display: flex; gap: 12px; align-items: center; width: 100%; text-align: right;
  font: inherit; padding: 15px; margin-bottom: 10px; background: var(--card);
  color: var(--ink); border: 2px solid var(--line); border-radius: 12px;
  cursor: pointer; transition: all 0.2s ease;
}
.opt:hover:not(:disabled) { border-color: var(--nafeza-primary); background: #F8FAFC; transform: translateX(-3px); }
.opt b { flex: none; width: 32px; height: 32px; border-radius: 50%; background: #EEF2F6; display: grid; place-items: center; font-size: 14px; color: var(--nafeza-primary); font-weight: 700; }
.opt.ok { border-color: var(--nafeza-green); background: rgba(14,122,69,0.08); color: var(--nafeza-green); }
.opt.bad { border-color: var(--bad); background: rgba(239,68,68,0.08); color: var(--bad); }

.verdict { font-size: 18px; font-weight: 700; margin: 12px 0; text-align: center; }
.verdict.ok { color: var(--nafeza-green); } .verdict.bad { color: var(--bad); }

#qrcode { display: flex; justify-content: center; margin: 15px 0; }
.player-tag { display: inline-block; background: rgba(27,73,138,0.08); color: var(--nafeza-primary); padding: 6px 14px; border-radius: 20px; margin: 4px; font-weight: 500; border: 1px solid rgba(27,73,138,0.2); }
.stat-bar { height: 8px; background: var(--line); border-radius: 4px; overflow: hidden; margin-top: 4px; }
.stat-fill { height: 100%; background: var(--nafeza-primary); width: 0%; transition: width 0.5s ease-out; }
</style>

  {q:"ماذا يعني الاختصار ETA في الشحن؟",o:["وقت الوصول المتوقع","رسوم النقل الإضافية","نوع الحاوية","شهادة الفحص"],a:0}
];
const LET = ["أ", "ب", "ج", "د"];

const AudioContext = window.AudioContext || window.webkitAudioContext;
let audioCtx = null;
function initAudio() {
  if (!audioCtx) audioCtx = new AudioContext();
  if (audioCtx.state === 'suspended') audioCtx.resume();
}
function playSound(type) {
  try {
    initAudio();
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.connect(gain); gain.connect(audioCtx.destination);
    if (type === 'tick') {
      osc.frequency.setValueAtTime(800, audioCtx.currentTime);
      gain.gain.setValueAtTime(0.04, audioCtx.currentTime);
      osc.start(); osc.stop(audioCtx.currentTime + 0.04);
    } else if (type === 'correct') {
      osc.frequency.setValueAtTime(523.25, audioCtx.currentTime);
      osc.frequency.exponentialRampToValueAtTime(659.25, audioCtx.currentTime + 0.2);
      gain.gain.setValueAtTime(0.08, audioCtx.currentTime);
      osc.start(); osc.stop(audioCtx.currentTime + 0.2);
    } else if (type === 'wrong') {
      osc.frequency.setValueAtTime(220, audioCtx.currentTime);
      osc.frequency.exponentialRampToValueAtTime(110, audioCtx.currentTime + 0.25);
      gain.gain.setValueAtTime(0.08, audioCtx.currentTime);
      osc.start(); osc.stop(audioCtx.currentTime + 0.25);
    }
  } catch(e) {}
}

const firebaseConfig = {
  apiKey: "AIzaSyD6rWwK4hQCvDaMlMIntHurpIEyl10AQQI",

if (typeof firebase !== 'undefined' && firebaseConfig.apiKey !== "YOUR_API_KEY") {

if(!CFG)try{const sv=JSON.parse(localStorage.getItem("quizQ")||"null");if(Array.isArray(sv)&&sv.length)Q=sv}catch(e){}
if(!CFG)try{const cf=JSON.parse(localStorage.getItem("quizCfg")||"null");if(cf){LIMIT=cf.t||30;NQ=cf.n||Q.length;TITLE=cf.ti||"";TARGET_PLAYERS=cf.tp||5}}catch(e){}
if(CFG){Q=CFG.q;LIMIT=CFG.t;NQ=Math.min(CFG.n,Q.length);TITLE=CFG.title||"";TARGET_PLAYERS=CFG.tp||5}

const app = document.getElementById("app");
const esc = s => s.replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const pts = t => Math.round(500 + 500 * (1 - t / LIMIT));
let S, tm;

function home(){
  if(CFG){
    app.innerHTML = `<h1>${esc(TITLE||"منصة تقييم نافذة")}</h1>
    <p style="text-align:center">أهلاً بك! اكتب اسمك للانضمام وانتظار بدء المسابقة مع الجميع.</p>
    <div class="card">
      <input id="nm" maxlength="20" placeholder="اكتب اسمك الثلاثي">
      <button class="btn" id="join">انضمام للغرفة</button>
    </div>
    <div id="wait-box"></div>`;
    
    document.getElementById("join").onclick = () => {
      initAudio();
      const name = document.getElementById("nm").value.trim();
      if(!name) { alert("من فضلك اكتب اسمك"); return; }
      joinLiveRoom(name);
    };
    return;
  }

  app.innerHTML = `<h1>منصة تقييم نافذة - لوحة المدرب</h1>
  <div class="card">
    <label class="fl">عنوان المسابقة<input id="ttl" maxlength="60" value="${esc(TITLE)}" placeholder="مثال: تقييم سيشن إجراءات الصادر والإفراج"></label>
    <label class="fl">عدد الأسئلة في الجولة<input id="nq" type="number" min="1" max="${Q.length}" value="${Math.min(NQ||Q.length,Q.length)}"></label>
    <label class="fl">مدة كل سؤال بالثواني<input id="lim" type="number" min="5" max="120" value="${LIMIT}"></label>
    <label class="fl">عدد المتدربين المطلوب للبدء التلقائي<input id="tp" type="number" min="1" max="100" value="${TARGET_PLAYERS}"></label>
  </div>
  <div class="card" style="text-align:center">
    <h2>رابط انضمام المتدربين (QR Code)</h2>
    <div id="qrcode"></div>
    <p style="word-break:break-all;font-size:13px;" id="link-txt"></p>
    <hr style="border:0;border-top:1px solid var(--line);margin:15px 0">
    <h3>المتدربون المنضمون (<span id="p-count">0</span> / <span id="p-target">${TARGET_PLAYERS}</span>):</h3>
    <div id="p-list" style="margin-bottom:12px;text-align:right"></div>
    <button class="btn" id="force-start" disabled>ابدأ المسابقة الآن 🚀</button>
    <button class="btn alt" id="reset-room-btn" style="margin-top:10px;border-color:var(--bad);color:var(--bad)">إعادة تصفير الغرفة 🔄</button>
  </div>
  <button class="btn alt" id="ed">تعديل الأسئلة</button>
  <button class="btn alt" id="dl" style="margin-top:10px">تنزيل نسخة المتدربين (quiz-trainees.html)</button><div id="out"></div>`;
  
  initInstructorLive();

  document.getElementById("ed").onclick = edit;
  document.getElementById("dl").onclick = dl;
  document.getElementById("reset-room-btn").onclick = () => {
    if(confirm("هل أنت تأكد من إعادة تصفير الغرفة للبدء مع سيشن جديد؟")) {
      db.ref("quizRoom").set({ state: "waiting", targetCount: TARGET_PLAYERS, qIndex: 0, players: {} });

function rd(){
  const n=+document.getElementById("nq").value, t=+document.getElementById("lim").value, tp=+document.getElementById("tp").value;
  NQ = Math.min(Math.max(n|0||Q.length,1),Q.length);
  LIMIT = Math.min(Math.max(t|0||30,5),120);
  TARGET_PLAYERS = Math.max(tp|0||5,1);
  TITLE = document.getElementById("ttl").value.trim();
  try{localStorage.setItem("quizCfg",JSON.stringify({n:NQ,t:LIMIT,ti:TITLE,tp:TARGET_PLAYERS}))}catch(e){}
}

function initInstructorLive(){
  rd();
  const traineeUrl = window.location.href.replace("instructor.html", "quiz-trainees.html");
  document.getElementById("link-txt").textContent = traineeUrl;
  
  const qrContainer = document.getElementById("qrcode");
  if(qrContainer && window.QRCode) {
    qrContainer.innerHTML = "";
    new QRCode(qrContainer, { text: traineeUrl, width: 160, height: 160 });
  }

  if(!db) return;
  const roomRef = db.ref("quizRoom");

  roomRef.on("value", snap => {
    const data = snap.val();
    if(!data) return;
    const players = data.players || {};
    const keys = Object.keys(players);
    document.getElementById("p-count").textContent = keys.length;
    document.getElementById("p-list").innerHTML = keys.length ? keys.map(k=>`<span class="player-tag">${players[k].name}</span>`).join(" ") : `<span style="color:var(--mute)">في انتظار انضمام المتدربين...</span>`;
    document.getElementById("force-start").disabled = keys.length === 0;

    if(data.state === "waiting" && keys.length >= TARGET_PLAYERS) {
      roomRef.update({ state: "playing", qIndex: 0 });
    }

    if(data.state === "playing" && !window.instructorActive) {
      window.instructorActive = true;
      runInstructorDashboard();
    }
  });

  document.getElementById("force-start").onclick = () => {
    db.ref("quizRoom").update({ state: "playing", qIndex: 0 });
  };
}

function runInstructorDashboard() {
  db.ref("quizRoom").on("value", snap => {
    const data = snap.val();
    if(!data) return;
    const currentQIdx = data.qIndex || 0;
    const players = Object.values(data.players || {});
    const sortedPlayers = [...players].sort((a,b)=>(b.score||0)-(a.score||0));
    const totalPlayers = players.length || 1;

    const answersCount = [0, 0, 0, 0];
    players.forEach(p => {
      if(p.answers && p.answers[currentQIdx] !== undefined) {
        answersCount[p.answers[currentQIdx]]++;
      }
    });
    
    app.innerHTML = `<h1>لوحة التحكم المباشرة 🖥️</h1>
    <div class="card">
      <div class="top"><span>السؤال ${currentQIdx + 1} من ${NQ}</span></div>
      <h2>${Q[currentQIdx].q}</h2>
      
      <div style="margin-bottom:15px;background:#F8FAFC;padding:14px;border-radius:14px;border:1px solid var(--line);">
        <h4 style="margin:0 0 10px;color:var(--nafeza-primary);">إحصائيات الإجابات المباشرة 📊</h4>
        ${Q[currentQIdx].o.map((optText, k)=>{
          const cnt = answersCount[k];
          const pct = Math.round((cnt / totalPlayers) * 100);
          return `<div style="margin-bottom:8px;font-size:13px;">
            <div style="display:flex;justify-content:space-between;">
              <span><b>${LET[k]}</b>. ${esc(optText)}${k===Q[currentQIdx].a?'✅':''}</span>
              <span>${cnt} لاعب (${pct}%)</span>
            </div>
            <div class="stat-bar"><div class="stat-fill" style="width:${pct}%"></div></div>
          </div>`;
        }).join("")}
      </div>

      <h3>لوحة الصدارة الحية 🏆</h3>
      <div id="live-board">
        ${sortedPlayers.map((p,i)=>`<div style="display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--line);">
          <span><b>${i+1}.</b>${esc(p.name)}</span>
          <b style="color:var(--nafeza-primary)">${p.score||0} نقطة</b>
        </div>`).join("")}
      </div>
      <button class="btn" id="next-q-btn" style="margin-top:16px">${currentQIdx + 1 < NQ ? "السؤال التالي ⬅️" : "إنهاء المسابقة 🏁"}</button>
    </div>`;

    document.getElementById("next-q-btn").onclick = () => {
      if(currentQIdx + 1 < NQ) {
        db.ref("quizRoom").update({ qIndex: currentQIdx + 1 });
      } else {
        db.ref("quizRoom").update({ state: "ended" });
        alert("انتهت المسابقة بنجاح!");
      }
    };
  });
}

function joinLiveRoom(name) {
  if(!db) return;
  let myId = localStorage.getItem("myQuizId");
  if(!myId) {
    myId = "p_" + Math.random().toString(36).substr(2,9);
    localStorage.setItem("myQuizId", myId);
  }
  db.ref("quizRoom/players/" + myId).set({ name: name, score: 0 });

  const roomRef = db.ref("quizRoom");
  roomRef.on("value", snap => {
    const data = snap.val();
    if(!data) return;
    const players = Object.values(data.players || {});

    if(data.state === "waiting") {
      app.innerHTML = `<h1>أهلاً بك، ${esc(name)}! 👋</h1>
      <div class="card" style="text-align:center">
        <p style="font-size:17px;font-weight:bold;color:var(--nafeza-green)">تم تسجيل دخولك بنجاح ✅</p>
        <p style="color:var(--mute)">في انتظار بدء المسابقة مع الجميع...</p>
        <hr style="border:0;border-top:1px solid var(--line);margin:15px 0">
        <h3>المتدربون المنضمون معك (${players.length}):</h3>
        <div>${players.map(p=>`<span class="player-tag">${esc(p.name)}</span>`).join(" ")}</div>
      </div>`;
    } else if(data.state === "playing") {
      syncTraineeQuestion(data.qIndex || 0, name, myId);
    } else if(data.state === "ended") {
      if(window.confetti) confetti({ particleCount: 150, spread: 80, origin: { y: 0.6 } });
      app.innerHTML = `<div class="card" style="text-align:center"><h1>انتهت المسابقة! 🎉</h1><p>شكراً لمشاركتك المتميزة في السيشن.</p></div>`;
    }
  });
}

let lastRenderedQ = -1;
function syncTraineeQuestion(qIdx, myName, myId) {
  if(lastRenderedQ === qIdx) return;
  lastRenderedQ = qIdx;
  
  const q = Q[qIdx];
  let answered = false;
  let startTime = Date.now();

  app.innerHTML = `<div class="top"><span>السؤال ${qIdx + 1} من ${NQ}</span></div>
  <div class="top"><span>الوقت المتبقي</span><span class="time" id="tt">${LIMIT}</span></div>
  <div class="tbar"><i id="tb"></i></div>
  <h2>${esc(q.q)}</h2>
  ${q.o.map((oText, k)=>`<button class="opt" data-k="${k}"><b>${LET[k]}</b><span>${esc(oText)}</span></button>`).join("")}
  <div id="result-area"></div>`;

  clearInterval(tm);
  tm = setInterval(() => {
    const left = Math.max(0, LIMIT - (Date.now() - startTime)/1000);
    const tt = document.getElementById("tt");
    if(tt) {
      tt.textContent = Math.ceil(left);
      document.getElementById("tb").style.width = (left/LIMIT*100) + "%";
      if(left <= 5 && left > 0) playSound('tick');
    }
    if(left <= 0 && !answered) handleAnswer(-1);
  }, 100);

  app.querySelectorAll(".opt").forEach(btn => {
    btn.onclick = () => {
      if(answered) return;
      handleAnswer(+btn.dataset.k);
    };
  });

  function handleAnswer(chosenIdx) {
    answered = true;
    clearInterval(tm);
    const elapsed = (Date.now() - startTime)/1000;
    const isCorrect = chosenIdx === q.a;
    const earned = isCorrect ? pts(elapsed) : 0;

    if(isCorrect) playSound('correct'); else playSound('wrong');

    app.querySelectorAll(".opt").forEach((b, k) => {
      b.disabled = true;
      if(k === q.a) b.classList.add("ok");
      else if(k === chosenIdx) b.classList.add("bad");
    });

    db.ref("quizRoom/players/" + myId + "/answers/" + qIdx).set(chosenIdx);
    if(earned > 0) {
      db.ref("quizRoom/players/" + myId + "/score").transaction(s => (s||0) + earned);
    }

    renderTraineeLeaderboard(isCorrect, earned);
  }
}

function renderTraineeLeaderboard(isCorrect, earned) {
  db.ref("quizRoom/players").once("value", snap => {
    const players = Object.values(snap.val() || {}).sort((a,b)=>(b.score||0)-(a.score||0));
    const resultArea = document.getElementById("result-area");
    if(!resultArea) return;

    resultArea.innerHTML = `
      <p class="verdict ${isCorrect?'ok':'bad'}">${isCorrect ? 'إجابة صحيحة! +'+earned+' نقطة 👏' : 'إجابة خاطئة ❌'}</p>
      <div class="card" style="margin-top:10px">
        <h3>ترتيب المتدربين الحالي 🏆</h3>
        ${players.map((p,i)=>`<div style="display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px solid var(--line)">
          <span><b>${i+1}.</b>${esc(p.name)}</span>
          <b style="color:var(--nafeza-primary)">${p.score||0} نقطة</b>
        </div>`).join("")}
      </div>
      <p style="color:var(--mute);text-align:center;font-size:13px;margin-top:10px;">في انتظار انتقال المدرب للسؤال التالي...</p>
    `;
  });
}

function dl(){
  rd();
  const cfg = {title:TITLE, t:LIMIT, n:NQ, tp:TARGET_PLAYERS, q:Q};
  const html = SRC.replace(/const\s+CFG\s*=\s*null\s*;/, ()=> "const CFG="+JSON.stringify(cfg).replace(/</g,"\\u003c")+";").replace(/<title>[\s\S]*?<\/title>/, ()=> "<title>"+esc(TITLE||"منصة تقييم نافذة")+"</title>");
  try {
    const a = document.createElement("a");
    a.href = URL.createObjectURL(new Blob([html],{type:"type/html"}));
    a.download = "quiz-trainees.html";
    document.body.appendChild(a); a.click(); a.remove();
  } catch(e){}
  document.getElementById("out").innerHTML = `<p style="color:var(--nafeza-green);margin-top:10px;font-weight:bold;">تم تحميل ملف المتدربين (quiz-trainees.html) بنجاح!</p>`;
}

function edit(){
  E = Q.map(x=>({q:x.q, o:[...x.o,"","","",""].slice(0,4), a:x.a}));
  app.innerHTML = `<h1>أسئلة المسابقة</h1><div id="qs"></div>
  <button class="btn alt" id="add">إضافة سؤال</button><button class="btn" id="sv" style="margin-top:10px">حفظ والعودة</button><p class="err" id="err"></p>`;
  const qs = document.getElementById("qs");
  const draw = () => {
    qs.innerHTML = E.map((x,i)=>`<div class="card" data-i="${i}"><div class="top"><span>السؤال ${i+1}</span><button class="del" data-del>حذف</button></div>
    <textarea data-f rows="2">${esc(x.q)}</textarea>
    ${x.o.map((t,k)=>`<label class="oe"><input type="radio" name="r${i}" data-r="${k}" ${x.a===k?"checked":""}><input type="text" data-o="${k}" value="${esc(t)}"></label>`).join("")}</div>`).join("");
  };
  qs.oninput = e => { const t=e.target,i=+t.closest(".card").dataset.i; if(t.dataset.f!==undefined)E[i].q=t.value; else if(t.dataset.o!==undefined)E[i].o[+t.dataset.o]=t.value; };
  qs.onchange = e => { const t=e.target; if(t.dataset.r!==undefined)E[+t.closest(".card").dataset.i].a=+t.dataset.r; };
  qs.onclick = e => { if(e.target.dataset.del!==undefined){ E.splice(+e.target.closest(".card").dataset.i,1); draw(); } };
  document.getElementById("add").onclick = () => { E.push({q:"",o:["","","",""],a:0}); draw(); };
  document.getElementById("sv").onclick = () => {
    const out=[]; for(let i=0;i<E.length;i++){ if(E[i].q.trim())out.push({q:E[i].q.trim(),o:E[i].o.filter(o=>o.trim()),a:E[i].a}); }
    Q = out; try{localStorage.setItem("quizQ",JSON.stringify(Q))}catch(e){}
    home();
  };
  draw();
}

if(CFG) document.getElementById("nt").remove();
home();
</script></body></html>
