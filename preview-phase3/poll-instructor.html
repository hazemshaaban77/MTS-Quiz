<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Live Poll | لوحة المدرب</title><link rel="stylesheet" href="../style.css"><script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-database-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script><script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script><script src="../firebase-config.js"></script><script src="../common.js"></script><style>main{max-width:850px}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}.grid2 .card{margin:0}.choice{display:flex;align-items:center;gap:14px;justify-content:space-between;margin:10px 0;padding:10px;border-radius:10px;background:#ffffff12}.bar{height:11px;background:#ffffff25;border-radius:10px;overflow:hidden}.bar i{display:block;height:100%;background:#0E7A45;transition:width .4s}.sub{color:var(--mute)}input,textarea{width:100%;margin:6px 0 12px}@media(max-width:650px){.grid2{grid-template-columns:1fr}}</style></head><body><main><header><img src="../mts.png" alt="MTS"><img src="../training.png" alt="Training Team"></header><div id="app"><p>جاري تحميل النشاط...</p></div></main><script>
const $=id=>document.getElementById(id), app=$("app");let room="",data=null,answers={},answerRef=null,roomRef=null,roomListener=null,answerListener=null;
const isTrainer=u=>!!u&&!u.isAnonymous;
auth.onAuthStateChanged(u=>{if(isTrainer(u)){if(!room)setup()}else login()});
function login(){app.innerHTML='<h1>دخول المدرب — Live Poll</h1><div class="card"><input id="email" type="email" placeholder="البريد الإلكتروني" dir="ltr"><input id="pw" type="password" placeholder="كلمة المرور"><button class="btn" id="sign">دخول</button><p id="err" class="err"></p></div>'; $("sign").onclick=()=>auth.signInWithEmailAndPassword($("email").value.trim(),$("pw").value).catch(()=>{$("err").textContent="راجع بيانات تسجيل الدخول"})}
function setup(){app.innerHTML='<h1>Live Poll | تصويت مباشر</h1><div class="card"><label>عنوان النشاط<input id="title" maxlength="70" value="تصويت مباشر"></label><label>سؤال التصويت<textarea id="question" rows="3" maxlength="350" placeholder="ما رأيك في...؟"></textarea></label><label>الاختيار الأول<input id="a" maxlength="120"></label><label>الاختيار الثاني<input id="b" maxlength="120"></label><label>الاختيار الثالث (اختياري)<input id="c" maxlength="120"></label><label>الاختيار الرابع (اختياري)<input id="d" maxlength="120"></label><button class="btn" id="start">فتح التصويت</button><p class="err" id="err"></p></div>'; $("start").onclick=start}
async function start(){const title=$("title").value.trim()||"تصويت مباشر",q=$("question").value.trim(),o=["a","b","c","d"].map(id=>$(id).value.trim()).filter(Boolean);if(!q||o.length<2){$("err").textContent="اكتب السؤال واختيارين على الأقل";return} $("start").disabled=true;
try{const id="p"+Math.random().toString(36).slice(2,9),r=db.ref("rooms/"+id);const ex=await r.once("value");if(ex.exists())throw Error("room collision — retry");
await r.set({meta:{title,activity:"poll"},qs:[{q,o}],ctl:{phase:"lobby",i:0,n:1,lock:null,voted:0},players:{}});room=id;subscribe();}catch(e){$("err").textContent="تعذّر فتح النشاط. تأكد من صلاحية حساب المدرب وقواعد Firebase."; $("start").disabled=false;}}
function subscribe(){if(roomRef&&roomListener)roomRef.off("value",roomListener);if(answerRef&&answerListener)answerRef.off("value",answerListener);
roomRef=db.ref("rooms/"+room);roomListener=s=>{data=s.val();if(!data){app.innerHTML="<h2>تم إغلاق النشاط</h2>";return}render()};
answerRef=db.ref("ans/"+room+"/0");answerListener=s=>{answers=s.val()||{};const label=$("received");if(label)label.textContent=Object.keys(answers).length+" صوت";};
roomRef.on("value",roomListener,()=>app.innerHTML="<p class='err'>تعذّر قراءة الغرفة</p>");
answerRef.on("value",answerListener,()=>{const e=$("err");if(e)e.textContent="تعذّر متابعة الأصوات"});
}
function link(file){return new URL(file+"?room="+encodeURIComponent(room),location.href).href}
function result(){const o=data.qs[0].o,ct=o.map(()=>0);Object.values(answers).forEach(v=>{if(Number.isInteger(v.k)&&v.k>=0&&v.k<ct.length)ct[v.k]++});return ct}
function render(){if(!data)return;const c=data.ctl||{},ph=c.phase,players=Object.keys(data.players||{}).length;
if(ph==="lobby"){app.innerHTML='<h1>'+esc(data.meta.title)+'</h1><div class="card"><h2>غرفة التصويت: <span dir="ltr">'+esc(room)+'</span></h2><div id="qr"></div><p class="sub" dir="ltr">'+esc(link("poll.html"))+'</p><p>المشاركون: <b id="players">'+players+'</b></p></div><div class="grid2"><button class="btn" id="open">بدء التصويت</button><button class="btn alt" id="display">فتح شاشة العرض</button></div><button class="btn red" id="end">إنهاء النشاط</button>';if(window.QRCode)new QRCode($("qr"),{text:link("poll.html"),width:180,height:180});$("open").onclick=()=>db.ref("rooms/"+room+"/ctl").update({phase:"q"}).catch(showError);$("display").onclick=()=>window.open(link("poll-screen.html"),"_blank");$("end").onclick=end;return}
const options=data.qs[0].o;app.innerHTML='<h1>'+esc(data.meta.title)+'</h1><div class="card"><h2>'+esc(data.qs[0].q)+'</h2><p>المشاركون: '+players+' | <strong id="received">'+Object.keys(answers).length+' صوت</strong></p>'+(ph==="rev"?'<div id="result"></div>':'<p class="sub">الأصوات مخفية حتى إظهار النتيجة.</p>')+'</div><div class="grid2"><button class="btn alt" id="display">شاشة العرض</button>'+(ph==="q"?'<button class="btn" id="reveal">إغلاق التصويت وإظهار النتيجة</button>':'<button class="btn" id="new">تصويت جديد</button>')+'</div><p id="err" class="err"></p><button class="btn red" id="end">إنهاء النشاط</button>';
$("display").onclick=()=>window.open(link("poll-screen.html"),"_blank");$("end").onclick=end;
if(ph==="q")$("reveal").onclick=async()=>{const b=$("reveal");b.disabled=true;try{const fresh=(await db.ref("ans/"+room+"/0").once("value")).val()||{};const c=options.map(()=>0);Object.values(fresh).forEach(v=>{if(Number.isInteger(v.k)&&v.k>=0&&v.k<c.length)c[v.k]++});await db.ref("rooms/"+room).update({cnt:{0:c},"ctl/phase":"rev","ctl/lock":true,"ctl/voted":Object.keys(fresh).length})}catch(e){showError();b.disabled=false}};
if(ph==="rev"){const ct=(data.cnt||{})[0]||result(),total=Math.max(1,ct.reduce((a,b)=>a+b,0));$("result").innerHTML=options.map((o,i)=>'<div class="choice"><b>'+esc(o)+'</b><span>'+ct[i]+' · '+Math.round(ct[i]/total*100)+'%</span></div><div class="bar"><i style="width:'+ct[i]/total*100+'%"></i></div>').join("");$("new").onclick=async()=>{if(!confirm("بدء تصويت جديد سيغلق الغرفة الحالية ويحذف بياناتها؛ هل ترغب في العودة للإعداد؟"))return;await closeRoom();setup()}}
}
function showError(){const e=$("err");if(e)e.textContent="حصل خطأ في Firebase؛ جرب مرة تانية"}
async function closeRoom(){const id=room;room="";if(roomRef&&roomListener)roomRef.off("value",roomListener);if(answerRef&&answerListener)answerRef.off("value",answerListener);await Promise.all(["rooms","ans","eids"].map(root=>db.ref(root+"/"+id).remove()))}
async function end(){if(!confirm("إنهاء النشاط هيمسح الغرفة والأصوات. تكمل؟"))return;try{await closeRoom();setup()}catch(e){showError()}}
</script></body></html>
